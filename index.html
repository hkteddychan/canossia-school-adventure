<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Canossa School Adventure! 🎒</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; font-family:'Comic Sans MS','Segoe UI',sans-serif; background:#fdf6e3; }
body { display:flex; flex-direction:column; height:100dvh; overflow:hidden; background:linear-gradient(180deg,#fff8e7 0%,#fdf6e3 60%,#f5e6c8 100%); }

#topbar { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:8px 14px; background:#ff8c42; color:#fff; font-weight:bold; }
#topbar .brand { font-size:1.02em; text-shadow:1px 1px 2px rgba(0,0,0,.3); }
#topbar .stats { display:flex; gap:10px; font-size:.95em; }
#topbar .stats span { background:rgba(255,255,255,.22); padding:3px 10px; border-radius:12px; }

#screen { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
@media (max-height:740px) and (min-width:600px){ .imgwrap img{max-height:170px; width:auto; max-width:100%; margin:0 auto} .card h2{font-size:1.05em} .story{font-size:.95em} }

.card { background:#fff; border:3px solid #f2c94c; border-radius:20px; padding:12px; width:100%; max-width:520px; box-shadow:0 4px 14px rgba(0,0,0,.08); margin-bottom:10px; }
.card h2 { color:#e76f51; font-size:1.14em; margin-bottom:5px; }
.card .story { background:#fff9ef; border-radius:12px; padding:8px 11px; margin-bottom:8px; color:#444; font-size:.98em; line-height:1.42; }
.card .story b { color:#e76f51; }
.mascot { font-size:.92em; background:#e8f6f3; border:2px dashed #2a9d8f; border-radius:12px; padding:7px 11px; margin-bottom:8px; color:#1d6a5e; }

.imgwrap { width:100%; border-radius:14px; overflow:hidden; margin-bottom:8px; background:#fdf6e3; }
.imgwrap img { width:100%; display:block; }

.choices { display:flex; flex-direction:column; gap:10px; width:100%; max-width:560px; margin-bottom:8px; }
.btn { border:none; border-radius:16px; padding:12px 16px; font-size:1.04em; font-weight:bold; font-family:inherit; cursor:pointer; color:#fff; text-align:left; transition:transform .08s, box-shadow .08s; width:100%; box-shadow:0 3px 0 rgba(0,0,0,.15); }
.btn:active { transform:scale(.97); box-shadow:0 1px 0 rgba(0,0,0,.15); }
.btn.study { background:#4a90d9; }
.btn.playc { background:#f4a261; }
.btn.finish { background:#2a9d8f; }
.btn.again { background:#ff8c42; }
.btn small { display:block; font-weight:normal; font-size:.82em; opacity:.92; }

.feedback { border-radius:14px; padding:12px; margin-bottom:8px; width:100%; max-width:560px; font-size:1em; line-height:1.5; animation:pop .3s; }
.feedback.ok { background:#e3f7df; border:2px solid #6ab04c; color:#2f5e1e; }
.feedback.no { background:#fdeaea; border:2px solid #e05252; color:#7a2525; }
.feedback .fb-learn { display:block; margin-top:8px; padding-top:8px; border-top:1px dashed rgba(0,0,0,.15); font-weight:bold; }
.feedback .fb-delta { display:block; margin-top:4px; font-weight:bold; }
@keyframes pop { 0%{transform:scale(.94); opacity:0} 100%{transform:scale(1); opacity:1} }

.progress { display:flex; gap:6px; justify-content:center; margin:2px 0 8px; flex-shrink:0; }
.pdot { width:13px; height:13px; border-radius:50%; background:#e0d5b8; border:2px solid #cbbd97; }
.pdot.done { background:#4a90d9; border-color:#3a7bc0; }

.mascotbar { position:sticky; bottom:0; left:0; width:100%; background:#2a9d8f; color:#fff; padding:10px 14px; text-align:center; font-weight:bold; display:none; box-shadow:0 -2px 8px rgba(0,0,0,.15); flex-shrink:0; }
.mascotbar.show { display:block; }
.mascotbar button { margin-left:10px; background:#fff; color:#1d6a5e; border:none; border-radius:12px; padding:6px 16px; font-weight:bold; font-family:inherit; font-size:1em; cursor:pointer; }

.bigemoji { font-size:3em; text-align:center; margin:4px 0; }
.title-screen { text-align:center; }
.title-screen h1 { color:#e76f51; font-size:1.5em; margin:4px 0; }
.title-screen .sub { color:#666; margin-bottom:12px; }
.mode-card { background:#fff; border:3px solid #f2c94c; border-radius:20px; padding:16px; width:100%; max-width:560px; margin-bottom:12px; box-shadow:0 4px 14px rgba(0,0,0,.08); }
.mode-card h2 { color:#e76f51; font-size:1.15em; margin-bottom:4px; }
.mode-card p { color:#666; font-size:.95em; margin-bottom:10px; }
.mode-card .btn { text-align:center; }

.exam-q { background:#fff9ef; border-radius:12px; padding:10px 12px; margin-bottom:10px; color:#444; font-size:1.05em; }
.opts { display:flex; flex-direction:column; gap:8px; width:100%; max-width:560px; }
.opt { border:2px solid #d9cfa8; background:#fffdf7; border-radius:12px; padding:12px 14px; font-size:1.05em; font-family:inherit; cursor:pointer; text-align:left; color:#333; transition:transform .08s; }
.opt:active { transform:scale(.97); }
.opt.correct { border-color:#6ab04c; background:#e3f7df; }
.opt.wrong { border-color:#e05252; background:#fdeaea; }
.opt:disabled { cursor:default; }
.btn.picked { outline:4px solid #fff; outline-offset:-4px; filter:brightness(1.15); }

.hint { color:#888; font-size:.85em; text-align:center; margin-top:4px; }
.future { border-radius:14px; padding:12px; margin-bottom:10px; width:100%; max-width:560px; }
.future.bad { background:#fbe9e7; border:2px solid #e07b39; }
.future.good { background:#e3f2fd; border:2px solid #4a90d9; }
.future h4 { margin-bottom:4px; }
.future.bad h4 { color:#c05020; }
.future.good h4 { color:#2060b0; }
.future p { font-size:.98em; color:#444; }

.gift { background:#fff; border:4px solid #e0527a; border-radius:18px; padding:20px; font-size:2.6em; cursor:pointer; text-align:center; user-select:none; width:100%; max-width:560px; margin-bottom:10px; box-shadow:0 4px 14px rgba(224,82,122,.25); transition:transform .1s; }
.gift:active { transform:scale(.95); }
.prize { font-size:2.4em; text-align:center; animation:pop .4s; margin:8px 0; }
.prize-name { text-align:center; color:#e0527a; font-weight:bold; font-size:1.1em; margin-bottom:10px; }

@media (min-width:700px){ body{font-size:17px} }
</style>
</head>
<body>
<div id="topbar">
  <div class="brand">🎒 Canossa School Adventure</div>
  <div class="stats"><span>😊 <b id="happy">50</b></span><span>⭐ <b id="score">0</b></span></div>
</div>
<div id="screen"></div>
<div id="mascotbar" class="mascotbar"><span id="mascot-msg"></span> <button id="mascot-btn">OK!</button></div>
<script src="assets/images.js"></script>
<script src="assets/game.js"></script>
</body>
</html>
